name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Re-release the catalog version even if that tag already exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check release credentials
        env:
          REPO_SYNC_PAT: ${{ secrets.REPO_SYNC_PAT }}
        run: |
          : "${REPO_SYNC_PAT:?REPO_SYNC_PAT secret is not set; it is needed to push the version bump past the branch ruleset}"

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.REPO_SYNC_PAT }}

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          CATALOG=gradle/libs.versions.toml
          released() { gh release view "v$1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; }

          VERSION=$(sed -n 's/^app-version-name = "\(.*\)"/\1/p' "$CATALOG")
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "app-version-name in ${CATALOG} is not major.minor.patch: '${VERSION}'"; exit 1 ;;
          esac
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ "${FORCE_RELEASE:-}" = "true" ]; then
            echo "Forcing re-release of v${VERSION}"
          else
            FOUND=false
            for _ in $(seq 1 200); do
              if released "$VERSION"; then
                PATCH=$((PATCH + 1))
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
              else
                FOUND=true
                break
              fi
            done
            if [ "$FOUND" != "true" ]; then
              echo "No free patch version found above ${MAJOR}.${MINOR}.${PATCH}"
              exit 1
            fi
          fi

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i -E "s/^app-version-name = \".*\"/app-version-name = \"${VERSION}\"/" "$CATALOG"
          sed -i -E "s/^app-version-code = \".*\"/app-version-code = \"${VERSION_CODE}\"/" "$CATALOG"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION} (versionCode ${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is not set}"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the artifact
        id: name
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DiscordRP-${VERSION}.apk"
          echo "apk=DiscordRP-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: discordrp-release
          path: ${{ steps.name.outputs.apk }}
          if-no-files-found: error

      - name: Commit version bump
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          CATALOG=gradle/libs.versions.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          apply_bump() {
            sed -i -E "s/^app-version-name = \".*\"/app-version-name = \"${VERSION}\"/" "$CATALOG"
            sed -i -E "s/^app-version-code = \".*\"/app-version-code = \"${VERSION_CODE}\"/" "$CATALOG"
          }

          for attempt in 1 2 3 4 5; do
            if git diff --quiet "$CATALOG"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add "$CATALOG"
            git commit -m "chore: release v${VERSION} [skip ci]"
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "push rejected (attempt ${attempt}); re-applying the bump on top of latest main"
            git fetch origin main
            git reset --hard origin/main
            apply_bump
          done
          echo "Failed to push after retries"
          exit 1

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          files: ${{ steps.name.outputs.apk }}
          generate_release_notes: true

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
